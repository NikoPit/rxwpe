[workspace]
resolver = "2"
members = ["cli", "assets", "parser", "scene", "video", "web", "shader", "media", "gpu", "output"]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
license-file = "LICENSE"
repository = "https://github.com/NikoPit/rxwpe"
readme = "README.md"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
lz4_flex = "0.11"
wgpu = "24"
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rxwpe-assets = { version = "0.1.0", path = "assets" }
rxwpe-parser = { version = "0.1.0", path = "parser" }
rxwpe-scene = { version = "0.1.0", path = "scene" }
rxwpe-video = { version = "0.1.0", path = "video" }
rxwpe-web = { version = "0.1.0", path = "web" }
rxwpe-shader = { version = "0.1.0", path = "shader" }
rxwpe-media = { version = "0.1.0", path = "media" }
rxwpe-gpu = { version = "0.1.0", path = "gpu" }
rxwpe-output = { version = "0.1.0", path = "output" }

[profile.release]
lto = "thin"
