[workspace]
resolver = "2"
members = ["cli", "assets", "parser", "scene", "video", "web", "shader", "media", "gpu", "output"]
default-members = ["cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
lz4_flex = "0.11"
wgpu = "24"
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }
rxwpe-assets = { path = "assets" }
rxwpe-parser = { path = "parser" }
rxwpe-scene = { path = "scene" }
rxwpe-video = { path = "video" }
rxwpe-web = { path = "web" }
rxwpe-shader = { path = "shader" }
rxwpe-media = { path = "media" }
rxwpe-gpu = { path = "gpu" }
rxwpe-output = { path = "output" }

[profile.release]
lto = "thin"
