[package]
name = "rxwpe"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "pnm"] }
lz4_flex = "0.11"
wgpu = "24"
pollster = "0.4"
winit = { version = "0.30", default-features = false, features = ["rwh_06", "wayland", "wayland-dlopen", "x11"] }
raw-window-handle = "0.6"
bytemuck = { version = "1", features = ["derive"] }
clap = { version = "4", features = ["derive"] }

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSResponder", "NSScreen", "NSView", "NSWindow"] }

[profile.release]
lto = "thin"
