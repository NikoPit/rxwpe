[package]
name = "rxwpe-output"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
pollster.workspace = true
raw-window-handle.workspace = true
wgpu.workspace = true
winit.workspace = true
rxwpe-gpu.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
wayland-client = "0.31"
smithay-client-toolkit = { version = "0.19", default-features = false }
wayland-backend = { version = "0.3", features = ["client_system", "dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5.2"
objc2-app-kit = { version = "0.2.2", default-features = false, features = ["NSResponder", "NSScreen", "NSView", "NSWindow"] }
