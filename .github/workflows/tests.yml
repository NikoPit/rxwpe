name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ runner.os }}-workspace
      - name: Test workspace with FFmpeg
        run: nix develop -c cargo test --workspace --locked
      - name: Test Nix configuration
        run: nix build .#checks.$(nix eval --impure --raw --expr builtins.currentSystem).configuration --no-link
      - name: Check Rust formatting
        run: nix develop -c cargo fmt --all -- --check

  rendering:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      XDG_RUNTIME_DIR: /tmp/rxwpe-runtime
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-rendering
      - name: Prepare runtime directory
        run: |
          mkdir -p "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
      - name: Test rendering and video playback with software OpenGL
        # The ci shell forces software rendering for CI tests only.
        run: nix develop .#ci -c cargo test --workspace --locked -- --ignored
